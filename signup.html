<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up</title>
    <link rel="stylesheet" href="style.css";>
</head>
<body>
    <main>
        <div class="form sign-up">
            <h1>sign up form</h1>

            
            <div class="tabs" id="tabs">
                <a href="signup.html" class="btn">Signup</a>                
                <a href="login.html" class="btn">Login</a>                
            </div>


            <form class=" form-sign-up">

                <label for="user name">user name
                    <input type="text" name="user name" id="user-name" >
                </label><br>

                <label for="Email">Email
                    <input type="email" name="Email" placeholder="email@gmail.com" id="Email" required>
                </label><br>

                <label for="password">password
                    <input type="password" name="password" id="password" required>
                </label><br>

                <label for="conform-pass">conform-pass
                    <input type="password" name="conform-pass" id="conform-pass" required>
                </label><br>

                <button class=" btn sign-btn">sign up</button>

            </form>
        </div>
    </main>

    <script src="script.js"></script>    

    <script src="./script.js"></script>    


</body>
</html>
