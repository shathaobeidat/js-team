<!DOCTYPE html> //login page code
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login </title>
    <link rel="stylesheet" href="style.css";>
</head>
    <body>
        <main>
            <div class="form container">
                <h1 id="title">Login Form</h1>
                <div class="tabs" id="tabs">
                    <a href="signup.html" class="btn">Signup</a>                
                    <a href="login.html" class="btn">Login</a>                
                </div>
                <div id="loginFileds" class="login-fields">
                    <div class=" input-box" id="input-box">
                        <input type="email" placeholder="Email Address">
                    </div>
                </div>
                <div id="signupFields" class="signup-fields">
                    <div class="input-box" id="input-box">
                        <input  type="password" placeholder=" password">
                    </div>
                    <button class="btn submit-btn" id="submit-btn"> LogIn </button>
                </div>
            </div>
<div class="form sign-up">
            <h1>sign up form</h1>
            <form class=" form-sign-up">

                <label for="user name">user name
                    <input type="text" name="user name" id="user-name" >
                </label><br>

                <label for="Email">Email
                    <input type="email" name="Email" placeholder="email@gmail.com" id="Email" required>
                </label><br>

                <label for="password">password
                    <input type="password" name="password" id="password" required>
                </label><br>

                <label for="conform-pass">conform-pass
                    <input type="password" name="conform-pass" id="conform-pass" required>
                </label><br>

                <button class=" btn submit-btn">sign up</button>

            </form>
        </main>
        <script src="./script.js"></script>    
    </body>
</html>
