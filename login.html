<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login </title>
</head>
<body>
    <div class="container">
        <h1 id="title">Login Form</h1>
        <div class="tabs" id="tabs">
            <button id="loginTab" onclick="showLogin()">
                Login
            </button>
            <button id="signupTab" class="active " onclick="showSignup()">
                Signup
            </button>
            
        </div>
        <div id="loginFileds" class="login-fields">
            <div class="input-box" id="input-box">
                <input type="email" placeholder="Email Address" id="email">
            </div>
        </div>
        <div id="signupFields" class="signup-fields">
            <div class="input-box" id="input-box">
                <input  type="password"
                    placeholder=" password" id="password">
            </div>

            <a href="#" id="forgot-password" class="forgot-link">Forgot password?</a>

              <div><button class="submit-btn" id="submit-btn">
                LogIn
            </button></div>

            <p class="signup-note">
                Not a member? <a href="#" id="signup-now" onclick="showSignup()">Signup now</a>
            </p>
        </div>
    </div>
    
</body>
</html>
