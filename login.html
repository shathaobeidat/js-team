<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="form container">
            <h1 id="title">Login Form</h1>

            <div class="tabs" id="tabs">
                <a href="signup.html" class="btn">Signup</a>                
                <a href="login.html" class="btn">Login</a>                
            </div>

            <div id="loginFileds" class="login-fields">
                <div class="input-box">
                    <input type="email" placeholder="Email Address" id="email" required>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" id="password" required>
                </div>

                <a href="#" id="forgot-password" class="forgot-link">Forgot password?</a>

                <div>
                    <button class="btn submit-btn" id="submit-btn">LogIn</button>
                </div>

                <p class="signup-note">
                    Not a member? <a href="signup.html" id="signup-now">Signup now</a>
                </p>
            </div>
        </div> 
    </main>   

    <script src="script.js"></script>    
</body>
</html>
