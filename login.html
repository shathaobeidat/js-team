<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login </title>
</head>
<body>
    <div class="container">
        <h1 id="title">Login Form</h1>
        <div class="tabs" id="tabs">
            <button id="loginTab" onclick="showLogin()">
                Login
            </button>
            <button id="signupTab" class="active " onclick="showSignup()">
                Signup
            </button>
            
        </div>
        <div id="loginFileds" class="login-fields">
            <div class="input-box" id="input-box">
                <input type="email" placeholder="Email Address">
            </div>
        </div>
        <div id="signupFields" class="signup-fields">
            <div class="input-box" id="input-box">
                <input  type="password"
                    placeholder=" password">
            </div>
              <button class="submit-btn" id="submit-btn">
                LogIn
            </button>
        </div>
    </div>
    
</body>
</html>
